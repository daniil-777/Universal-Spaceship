<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAPCOM</title><meta name="color-scheme" content="dark"><link rel="icon" href="data:,">
<style>
:root{--bg:#05070d;--glass:rgba(24,27,36,.62);--line:rgba(255,255,255,.08);--text:#f5f5f7;--dim:rgba(235,235,245,.6);--faint:rgba(235,235,245,.3);
  --bubble:rgba(255,255,255,.075);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{font:15px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;display:grid;place-items:center;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(1200px 700px at 70% -10%,rgba(64,84,160,.35),transparent 60%),radial-gradient(900px 600px at 0% 110%,rgba(120,60,140,.22),transparent 60%),
  radial-gradient(1px 1px at 12% 22%,#fff8,transparent 50%),radial-gradient(1px 1px at 72% 64%,#fff6,transparent 50%),radial-gradient(1.5px 1.5px at 38% 82%,#fff7,transparent 50%),
  radial-gradient(1px 1px at 88% 18%,#fff9,transparent 50%),radial-gradient(1px 1px at 56% 38%,#fff5,transparent 50%),var(--bg)}
.card{width:min(440px,calc(100vw - 32px));height:min(700px,calc(100dvh - 32px));display:flex;flex-direction:column;background:var(--glass);
  border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
  box-shadow:0 40px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;animation:rise .6s var(--ease)}
header{position:relative;display:flex;align-items:center;gap:12px;padding:16px 18px 12px}
.orb{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,#9fd0ff,#2a6df4 45%,#131a3a 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 6px 18px rgba(42,109,244,.35);transition:box-shadow .4s}
.busy .orb{animation:pulse 1.4s ease-in-out infinite}
.who{flex:1;min-width:0} .who b{display:block;font-weight:600;letter-spacing:.04em;font-size:15px} .who span{display:block;color:var(--dim);font-size:12px}
.pill{font:500 11px/1 -apple-system,system-ui,sans-serif;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:99px;padding:6px 9px;white-space:nowrap}
.pill i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-right:6px;vertical-align:1px}
.pill.ok i{background:var(--green)} .pill.bad i{background:var(--red)}
.bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;overflow:hidden}
.bar div{height:100%;width:0;background:linear-gradient(90deg,#5ac8fa,var(--blue));transition:width .25s var(--ease),opacity .6s} .bar.done div{opacity:0}
.tools{display:flex;align-items:center;gap:8px;padding:0 18px 10px;border-bottom:1px solid var(--line)}
select{appearance:none;flex:1;min-width:0;font:13px -apple-system,system-ui,sans-serif;color:var(--text);background:rgba(255,255,255,.06) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="%23aaa" fill="none" stroke-width="1.5"/></svg>') no-repeat right 11px center;
  border:1px solid var(--line);border-radius:10px;padding:7px 28px 7px 10px}
.switch{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.switch input{appearance:none;width:30px;height:18px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;margin:0;cursor:pointer;transition:background .25s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.switch input:checked{background:var(--green)} .switch input:checked::after{transform:translateX(12px)}
#log{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:84%;padding:9px 13px;border-radius:19px;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .32s var(--ease) both}
.bot{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:6px} .me{align-self:flex-end;background:var(--blue);border-bottom-right-radius:6px}
.note{align-self:center;color:var(--faint);font-size:12px;text-align:center;max-width:90%;animation:pop .32s var(--ease) both}
.meta{display:none;align-self:flex-start;margin:-6px 0 2px 6px;font:11px/1.5 "SF Mono",ui-monospace,Menlo,monospace;color:var(--faint);max-width:90%}
.debug .meta{display:block} .meta b{font-weight:500;color:var(--dim)} .meta .n{display:inline-block;margin-right:6px}
.dots{display:inline-flex;gap:4px;padding:4px 0} .dots span{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;animation:pop .4s .1s var(--ease) both}
.chip{font:13px -apple-system,system-ui,sans-serif;color:#9fd0ff;background:rgba(10,132,255,.12);border:1px solid rgba(10,132,255,.25);border-radius:99px;padding:6px 11px;cursor:pointer;transition:background .2s}
.chip:hover{background:rgba(10,132,255,.22)}
form{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line)}
#q{flex:1;min-width:0;font:15px -apple-system,system-ui,sans-serif;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:99px;padding:10px 15px;outline:none;transition:border-color .2s}
#q:focus{border-color:rgba(10,132,255,.6)} #q::placeholder{color:var(--faint)}
#go{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .2s}
#go:active{transform:scale(.92)} #go svg{width:18px;height:18px} #go .stop{display:none} .busy #go{background:rgba(255,255,255,.16)} .busy #go .up{display:none} .busy #go .stop{display:block}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}} @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}} @keyframes pulse{50%{box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 26px rgba(90,200,250,.55)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<main class="card" id="card">
  <header><div class="orb"></div><div class="who"><b>CAPCOM</b><span>Astro Pilot guide · runs on your device</span></div>
    <div class="pill" id="pill"><i></i><span>Starting</span></div><div class="bar" id="bar"><div></div></div></header>
  <div class="tools"><select id="scene" aria-label="Scene"></select><label class="switch"><input type="checkbox" id="dbg">Debug</label></div>
  <section id="log" aria-live="polite"></section>
  <form id="f" autocomplete="off"><input id="q" placeholder="Ask CAPCOM…" aria-label="Message" maxlength="400">
    <button id="go" type="submit" aria-label="Send"><svg class="up" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg></button></form>
</main>
<script type="module">
// demo.html — CAPCOM chat panel (spec §7): the greeting shows at once; the model loads in capcom-worker.js (WebGPU → WASM → notes only).
// ?model=<model folder URL or Hub id>&kb=<kb.json URL>&device=auto|webgpu|wasm&dtype=q4f16|q4&debug=1   (served by chat/web/serve.mjs)
import { createCapcomClient } from './capcom-client.js';
import { HIGHLIGHTS } from './prompt.js';
const q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
const MODEL = q.get('model') || '/__capcom/models/lfm350-base-web', KB = q.get('kb') || '/__capcom/kb/kb.json';
const GREETING = 'CAPCOM here. Ask me anything about the pilot, or try one of these:';
const SUGGEST = ['How does it learn to dodge asteroids?', 'How fast does the station orbit?', 'How do I try the landing?'];
const card = $('card'), log = $('log'), pill = $('pill'), bar = $('bar'), sel = $('scene'), dbg = $('dbg'), input = $('q');
const history = [], seen = new Set(); let info = null, busy = null, scene = q.get('scene') || 'belt';
const setPill = (t, cls = '') => { pill.className = `pill ${cls}`; pill.lastChild.textContent = t; };
const scroll = () => { log.scrollTop = log.scrollHeight; };
const add = (cls, text = '') => { const d = document.createElement('div'); d.className = cls; d.textContent = text; log.append(d); scroll(); return d; };
const fmt = (x, d = 0) => (x == null ? '–' : x.toFixed(d));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
for (const [k, name] of HIGHLIGHTS) sel.add(new Option(`Watching: ${name}`, k, false, k === scene));
sel.onchange = () => { seen.add(scene); scene = sel.value; seen.delete(scene); };
try { dbg.checked = q.get('debug') === '1' || localStorage.getItem('capcom.debug') === '1'; } catch { dbg.checked = q.get('debug') === '1'; }
const syncDbg = () => { card.classList.toggle('debug', dbg.checked); try { localStorage.setItem('capcom.debug', dbg.checked ? '1' : '0'); } catch { /* private mode */ } };
dbg.onchange = syncDbg; syncDbg();

add('msg bot', GREETING);
const chips = add('chips');
for (const s of SUGGEST) { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = s; b.onclick = () => send(s); chips.append(b); }

const client = createCapcomClient({ onProgress: (p) => {
  if (p.status === 'download') { bar.firstChild.style.width = `${(100 * p.progress).toFixed(1)}%`; setPill(`Loading ${Math.floor(100 * p.progress)}%`); }
  else if (p.status === 'load') setPill(`Loading ${p.device === 'webgpu' ? 'WebGPU' : 'WASM'}`);
  else if (p.status === 'warmup') setPill('Warming up');
  else if (p.status === 'fallback') add('note', `${p.device}/${p.dtype} unavailable — trying the next runtime.`);
} });
const ready = client.load({ model: MODEL, kb: KB, device: q.get('device') || 'auto', dtype: q.get('dtype') || null }).then((i) => {
  info = i; bar.classList.add('done');
  if (i.ready) setPill(`${i.device === 'webgpu' ? 'WebGPU' : 'WASM'} · ${i.dtype}`, 'ok');
  else { setPill('Notes only', 'bad'); add('note', 'The model could not start in this browser, so CAPCOM answers from its flight notes.'); }
  return i;
}).catch((e) => { setPill('Offline', 'bad'); add('note', `CAPCOM could not start: ${e.message}`); throw e; });

async function send(text) {
  text = text.trim(); if (!text) return null;
  if (busy) client.abort();
  chips.remove(); add('msg me', text); input.value = '';
  const bubble = add('msg bot'), meta = add('meta'), dots = document.createElement('span'); dots.className = 'dots'; dots.innerHTML = '<span></span><span></span><span></span>'; bubble.append(dots);
  const mine = {}; busy = mine; card.classList.add('busy');
  let got = '';
  try {
    const state = { scene, seen: [...seen] };
    const r = await client.ask(text, { history: history.slice(-4), state, onToken: (t) => { if (!got) bubble.textContent = ''; got += t; bubble.textContent = got; scroll(); } });
    bubble.textContent = r.text || got || (r.aborted ? '…' : '');
    if (r.fallback) bubble.classList.add('card');
    if (!r.fallback && !r.aborted && r.text) history.push({ role: 'user', content: text }, { role: 'assistant', content: r.text });
    meta.innerHTML = `<b>notes</b> ${r.notes.length ? r.notes.map((id, i) => `<span class="n" title="${esc((r.noteTitles || [])[i] || '')}">${esc(id)} ${fmt(r.scores[i], 1)}</span>`).join('') : 'none'}<br>` +
      (r.fallback ? `<b>${r.fallback === 'loading' ? 'model loading' : 'notes only'}</b> · retrieval card` :
        `<b>TTFT</b> ${fmt(r.ttftMs)} ms · <b>${fmt(r.tokPerSec, 1)}</b> tok/s · ${r.tokens} tok · ${r.promptTokens} prompt · ${r.device}/${r.dtype}${r.aborted ? ' · stopped' : ''}`);
    scroll(); return r;
  } catch (e) { bubble.textContent = `Error: ${e.message}`; return null; }
  finally { if (busy === mine) { busy = null; card.classList.remove('busy'); } }
}
$('f').onsubmit = (e) => { e.preventDefault(); if (busy && !input.value.trim()) client.abort(); else send(input.value); };
window.capcomDemo = { ready, send, client };
</script></body></html>
