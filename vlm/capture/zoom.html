<!doctype html>
<html><head><meta charset="utf-8"><title>apv zoom capture</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } canvas { display: block; width: 100vw; height: 100vh; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head><body><canvas id="view"></canvas><div id="zoomHud" hidden></div><input type="checkbox" id="swZoomSun" hidden>
<script type="module">
// The dataset zoom page (spec §3.2 Z): the app's attachEarthZoom with the app's ACES tone mapping, DPR 1, a ship:false host,
// orbitInfo.utc from the view, "Always day" through #swZoomSun's change event, SOURCES[1] patched to EOX 2016 in the open
// profile (same module instance), and RenderPass.prototype.render wrapped to keep the camera and scene it renders.
import * as THREE from 'three';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SOURCES } from '/src/earthtiles.js';
import { attachEarthZoom } from '/src/earthzoom.js';
const q = new URLSearchParams(location.search);
if (q.get('licence') !== 'nc') Object.assign(SOURCES[1], { maxLevel: 15, name: 'EOxCloudless 2016', credit: 'EOxCloudless https://cloudless.eox.at by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2016 & 2017)', url: (z, x, y) => `https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/${z}/${y}/${x}.jpg` });
const render0 = RenderPass.prototype.render;
RenderPass.prototype.render = function (...a) { window.__zoomCam = this.camera; window.__zoomScene = this.scene; return render0.apply(this, a); };
const canvas = document.getElementById('view'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight, false); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const view = { lat: +(q.get('lat') || 0), lon: +(q.get('lon') || 0), altKm: 420, utc: Date.UTC(2026, 5, 21, 12) };
const host = { manual: false, setManual(b) { this.manual = b; }, toast: () => {}, flightControls: () => {}, entry: () => ({ lat: view.lat, lon: view.lon, altKm: view.altKm, ship: false }) };
const zoom = attachEarthZoom({ renderer, space: { earthTextures: null, orbitInfo: { get utc() { return view.utc; } } }, host, texturePath: '/textures/' });
// not opened here: the probe's goView opens each view, so boot fetches no tiles for a view that is never captured
let last = performance.now();
(function loop(now) { requestAnimationFrame(loop); const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now; zoom.render(dt); })(performance.now());
const sw = document.getElementById('swZoomSun');
window.__zoomPage = { zoom, view, ready: true, setAlwaysDay(on) { sw.checked = !!on; sw.dispatchEvent(new Event('change')); } };
</script></body></html>
